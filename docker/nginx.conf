# ─────────────────────────────────────────────────────────────────────────────
# nginx — Pnömotoraks AI Reverse Proxy
# Rate limiting, güvenlik başlıkları, upstream health
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;    # nginx versiyon bilgisini gizle

    # ── Upload limiti: 50MB (DICOM dosyaları için) ────────────────────────────
    client_max_body_size 50M;
    client_body_timeout  60s;
    client_header_timeout 10s;

    # ── Gzip sıkıştırma ───────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Rate limiting tanımları ───────────────────────────────────────────────
    # Inference endpoint: IP başına 10 istek/dakika (DICOM analizi yavaş)
    limit_req_zone $binary_remote_addr zone=predict_limit:10m rate=10r/m;

    # Genel API: IP başına 60 istek/dakika
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # ── Upstream tanımları ────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 8;
    }

    upstream frontend {
        server frontend:80;
        keepalive 4;
    }

    # ── HTTP → HTTPS yönlendirme (SSL aktifse) ────────────────────────────────
    server {
        listen 80;
        server_name _;

        # SSL sertifikası varsa HTTPS'e yönlendir
        # Yoksa (geliştirme) doğrudan serve et
        # SSL etkinleştirmek için: bu bloğu uncomment et
        # return 301 https://$host$request_uri;

        include /etc/nginx/conf.d/locations.conf;
    }

    # ── HTTPS sunucu (SSL sertifikası varsa) ─────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     include /etc/nginx/conf.d/locations.conf;
    # }
}
