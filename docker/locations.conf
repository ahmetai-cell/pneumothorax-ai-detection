# nginx location blokları
# Frontend React → /api/* ile backend'i çağırır.
# nginx burada /api prefix'ini soyarak backend'e iletir.

# ── Güvenlik başlıkları ───────────────────────────────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ── /api/predict — inference, rate limited (frontend → backend) ──────────────
location = /api/predict {
    limit_req zone=predict_limit burst=5 nodelay;
    limit_req_status 429;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 50M;
}

location = /api/predict/tta {
    limit_req zone=predict_limit burst=5 nodelay;
    limit_req_status 429;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 50M;
}

# ── /api/* — diğer API endpoint'leri (health, results, metrics, docs) ─────────
location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}

# ── Frontend (React SPA) ─────────────────────────────────────────────────────
location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;

    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

location @spa_fallback {
    proxy_pass http://frontend/;
}
