# Ortak location blokları — hem HTTP hem HTTPS sunucu tarafından include edilir

# ── Güvenlik başlıkları (tüm yanıtlara) ─────────────────────────────────────
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Content-Security-Policy — production'da sıkılaştırın
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;" always;

# ── /predict — inference, rate limited ───────────────────────────────────────
location = /predict {
    limit_req zone=predict_limit burst=5 nodelay;
    limit_req_status 429;

    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;    # Model inference için uzun timeout
    proxy_send_timeout 120s;
    client_max_body_size 50M;
}

location = /predict/tta {
    limit_req zone=predict_limit burst=5 nodelay;
    limit_req_status 429;

    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;    # TTA (5 augmentation) için daha uzun
    proxy_send_timeout 180s;
    client_max_body_size 50M;
}

# ── /health, /results — genel API ────────────────────────────────────────────
location ~ ^/(health|results|docs|openapi.json) {
    limit_req zone=api_limit burst=20 nodelay;

    proxy_pass         http://backend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}

# ── Frontend (React SPA) ─────────────────────────────────────────────────────
location / {
    proxy_pass         http://frontend;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_cache_valid  200 1d;    # Statik dosyaları cache'le

    # SPA için: 404'leri index.html'e yönlendir (React Router)
    proxy_intercept_errors on;
    error_page 404 = @spa_fallback;
}

location @spa_fallback {
    proxy_pass http://frontend/;
}
